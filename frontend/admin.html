<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Cardápio</title>

<link rel="stylesheet" href="/style.css?v=3">

</head>

<body>

<div class="container">

    <header>
        <h1>Admin - Cardápio</h1>
    </header>

    <section class="card">

        <h2 id="titulo-form-produto">Criar produto</h2>

        <div class="form-grid">

            <input id="nome" placeholder="Nome do produto">
            <input id="descricao" placeholder="Descrição">
            <input id="preco" placeholder="Preço">
            <select id="categoria"></select>

        </div>

        <button class="btn-primary" onclick="salvarProduto()">
            Salvar
        </button>

        <button id="btn-cancelar-edicao" class="btn-delete" style="display:none"
            onclick="cancelarEdicao()">
            Cancelar edição
        </button>

    </section>

    <section class="card">

        <h2>Produtos cadastrados</h2>

        <div id="lista_produtos" class="produtos-grid"></div>

    </section>

    <section class="card">

        <h2>Categorias</h2>

        <div class="form-grid">
            <input id="nova-categoria" placeholder="Nome da categoria">
        </div>

        <button class="btn-primary" onclick="criarCategoria()">
            Adicionar categoria
        </button>

        <div id="lista_categorias" class="produtos-grid"></div>

    </section>

</div>

<script src="/app.js?v=3"></script>

</body>
</html>
