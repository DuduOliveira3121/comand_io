<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recepção - Reservas e Lista de Espera</title>
<link rel="stylesheet" href="/style.css?v=3">
<style>
  .recepcao { max-width: 1200px; margin: 0 auto; padding: 10px 0 40px; }
  .recepcao header a { margin: 0 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .recepcao label { display: flex; flex-direction: column; font-size: 13px; color: #444; gap: 4px; }
  .recepcao input, .recepcao select, .recepcao textarea { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .linha-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .acoes button, .btn-sec { padding: 6px 10px; border-radius: 6px; border: 1px solid #bbb; background: #fff; cursor: pointer; font-size: 13px; }
  .acoes button:hover, .btn-sec:hover { background: #f0f0f0; }
  .btn-ok { background: #2e7d32 !important; color: #fff; border-color: #2e7d32 !important; }
  .btn-perigo { background: #c62828 !important; color: #fff; border-color: #c62828 !important; }
  #mensagem { position: sticky; top: 0; z-index: 10; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; display: none; font-weight: bold; }
  #mensagem.sucesso { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
  #mensagem.erro { display: block; background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
  .tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tabela th, .tabela td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
  .badge-confirmada { background: #e3f2fd; color: #0d47a1; }
  .badge-aguardando { background: #fff8e1; color: #e65100; }
  .badge-em_atendimento { background: #e8f5e9; color: #1b5e20; }
  .badge-cancelada { background: #eceff1; color: #546e7a; text-decoration: line-through; }
  .badge-nao_compareceu { background: #fce4ec; color: #880e4f; }
  .badge-finalizada { background: #ede7f6; color: #4527a0; }
  .agenda { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .agenda-mesa { border: 1px solid #e1e1e1; border-radius: 8px; padding: 10px; background: #fff; }
  .agenda-mesa h3 { margin: 0 0 6px; font-size: 16px; display: flex; justify-content: space-between; }
  .agenda-item { border-left: 4px solid #90caf9; padding: 4px 8px; margin: 6px 0; font-size: 13px; background: #fafafa; }
  .agenda-item.cancelada, .agenda-item.nao_compareceu { opacity: .55; border-left-color: #bbb; }
  .agenda-item.em_atendimento { border-left-color: #66bb6a; }
  .agenda-item.aguardando { border-left-color: #ffa726; }
  .agenda-item.finalizada { border-left-color: #9575cd; }
  .resumo { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .fila-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px; border: 1px solid #e1e1e1; border-radius: 8px; margin-bottom: 8px; background: #fff; }
  .fila-pos { font-size: 22px; font-weight: bold; color: #e65100; min-width: 36px; text-align: center; }
  .fila-info { flex: 1; }
  .fila-info small { color: #666; }
  .mesas-agora { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 6px 10px; border-radius: 16px; font-size: 13px; }
  .chip.livre { background: #e8f5e9; color: #1b5e20; }
  .chip.ocupada { background: #ffebee; color: #b71c1c; }
  .btn-chip { margin-left: 6px; padding: 2px 8px; font-size: 11px; border-radius: 10px; border: 1px solid #b71c1c; background: #fff; color: #b71c1c; cursor: pointer; }
  .btn-chip:hover { background: #b71c1c; color: #fff; }
  .muted { color: #777; font-size: 13px; }
  @media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="recepcao container">
  <header>
    <h1>Recepção — Reservas e Lista de Espera</h1>
    <a href="/mesas">Painel de mesas</a> · <a href="/admin">Admin</a>
  </header>

  <div id="mensagem" role="alert"></div>

  <section class="card">
    <h2>Mesas agora</h2>
    <div id="mesas-agora" class="mesas-agora"></div>
  </section>

  <div class="grid-2">
    <section class="card">
      <h2 id="titulo-form-reserva">Nova reserva</h2>
      <form id="form-reserva" onsubmit="salvarReserva(event)">
        <input type="hidden" id="reserva-id">
        <div class="linha-form">
          <label>Cliente *<input id="r-cliente" maxlength="100" required></label>
          <label>Contato (telefone/e-mail) *<input id="r-contato" maxlength="120" required></label>
        </div>
        <div class="linha-form">
          <label>Data *<input id="r-data" type="date" required></label>
          <label>Horário *<input id="r-horario" type="time" required></label>
          <label>Pessoas *<input id="r-pessoas" type="number" min="1" value="2" required></label>
        </div>
        <div class="linha-form">
          <label>Mesa *
            <select id="r-mesa" required><option value="">Clique em "Ver mesas disponíveis"</option></select>
          </label>
          <label>Observação<input id="r-observacao" maxlength="255"></label>
        </div>
        <div class="acoes">
          <button type="button" onclick="carregarMesasDisponiveis()">🔍 Ver mesas disponíveis</button>
          <button type="submit" class="btn-ok" id="btn-salvar-reserva">Salvar reserva</button>
          <button type="button" onclick="limparFormulario()">Limpar</button>
        </div>
        <p id="info-disponiveis" class="muted"></p>
      </form>
    </section>

    <section class="card">
      <h2>Lista de espera</h2>
      <form onsubmit="entrarNaFila(event)">
        <div class="linha-form">
          <label>Nome *<input id="e-nome" maxlength="100" required></label>
          <label>Contato *<input id="e-contato" maxlength="120" required></label>
          <label>Pessoas *<input id="e-pessoas" type="number" min="1" value="2" required></label>
        </div>
        <div class="linha-form">
          <label>Observação<input id="e-observacao" maxlength="255"></label>
        </div>
        <div class="acoes"><button type="submit" class="btn-ok">Adicionar à fila</button></div>
      </form>
      <h3>Ordem de atendimento</h3>
      <div id="fila"></div>
    </section>
  </div>

  <section class="card">
    <h2>Agenda diária</h2>
    <label style="max-width:200px">Dia<input id="agenda-data" type="date" onchange="carregarAgenda()"></label>
    <div id="agenda-resumo" class="resumo"></div>
    <div id="agenda" class="agenda"></div>
  </section>

  <section class="card">
    <h2>Consultar reservas</h2>
    <div class="linha-form">
      <label>Data<input id="f-data" type="date"></label>
      <label>Mesa<select id="f-mesa"><option value="">Todas</option></select></label>
      <label>Situação<select id="f-status"><option value="">Todas</option></select></label>
      <label>Cliente/contato<input id="f-busca" placeholder="Buscar..."></label>
    </div>
    <div class="acoes">
      <button type="button" class="btn-ok" onclick="consultarReservas()">Filtrar</button>
      <button type="button" onclick="filtroRapido('hoje')">Hoje</button>
      <button type="button" onclick="filtroRapido('ativas')">Ativas de hoje</button>
      <button type="button" onclick="filtroRapido('limpar')">Limpar filtros</button>
    </div>
    <div style="overflow-x:auto">
      <table class="tabela">
        <thead><tr><th>Data</th><th>Hora</th><th>Mesa</th><th>Cliente</th><th>Pessoas</th><th>Situação</th><th>Ações</th></tr></thead>
        <tbody id="lista-reservas"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="/recepcao.js"></script>
</body>
</html>
