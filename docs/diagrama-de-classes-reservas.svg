<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1055" viewBox="0 0 1280 1055" font-family="Arial, Helvetica, sans-serif">
  <rect width="1280" height="1055" fill="#ffffff"/>

  <text x="640" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#1a237e">
    Diagrama de Classes — Reservas de Mesas e Lista de Espera
  </text>
  <text x="640" y="50" font-size="12" text-anchor="middle" fill="#777">
    classes novas em azul · classes já existentes no comand.io em cinza
  </text>

  <defs>
    <!-- losango vazado: agregação -->
    <marker id="agg" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto">
      <path d="M0,6 L7,1 L14,6 L7,11 Z" fill="#fff" stroke="#555" stroke-width="1.2"/>
    </marker>
    <!-- seta simples: navegabilidade -->
    <marker id="nav" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10" fill="none" stroke="#555" stroke-width="1.3"/>
    </marker>
    <!-- seta tracejada: dependência -->
    <marker id="dep" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10" fill="none" stroke="#6a1b9a" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- ====================== ENUM StatusReserva ====================== -->
  <g>
    <rect x="40" y="80" width="250" height="172" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.6" rx="3"/>
    <line x1="40" y1="128" x2="290" y2="128" stroke="#6a1b9a" stroke-width="1.2"/>
    <text x="165" y="100" font-size="11" text-anchor="middle" fill="#6a1b9a" font-style="italic">&#171;enumeration&#187;</text>
    <text x="165" y="118" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a148c">StatusReserva</text>
    <g font-size="12" fill="#4a148c">
      <text x="52" y="148">confirmada</text>
      <text x="52" y="168">aguardando</text>
      <text x="52" y="188">em_atendimento</text>
      <text x="52" y="208">cancelada</text>
      <text x="52" y="228">nao_compareceu</text>
      <text x="52" y="246">finalizada</text>
    </g>
  </g>

  <!-- ====================== ENUM StatusListaEspera ====================== -->
  <g>
    <rect x="990" y="80" width="250" height="112" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.6" rx="3"/>
    <line x1="990" y1="128" x2="1240" y2="128" stroke="#6a1b9a" stroke-width="1.2"/>
    <text x="1115" y="100" font-size="11" text-anchor="middle" fill="#6a1b9a" font-style="italic">&#171;enumeration&#187;</text>
    <text x="1115" y="118" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a148c">StatusListaEspera</text>
    <g font-size="12" fill="#4a148c">
      <text x="1002" y="148">aguardando</text>
      <text x="1002" y="168">atendido</text>
      <text x="1002" y="186">desistiu</text>
    </g>
  </g>

  <!-- ====================== MESA (existente) ====================== -->
  <g>
    <rect x="490" y="80" width="300" height="140" fill="#eeeeee" stroke="#555" stroke-width="1.6" rx="3"/>
    <line x1="490" y1="108" x2="790" y2="108" stroke="#555" stroke-width="1.2"/>
    <line x1="490" y1="188" x2="790" y2="188" stroke="#555" stroke-width="1.2"/>
    <text x="640" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Mesa</text>
    <g font-size="12" fill="#333">
      <text x="502" y="126">- id: int</text>
      <text x="502" y="144">- numero: int {unique}</text>
      <text x="502" y="162">- status: str</text>
      <text x="502" y="180">- capacidade: int</text>
      <text x="502" y="206">+ to_dict(): dict</text>
    </g>
  </g>

  <!-- ====================== RESERVA (nova) ====================== -->
  <g>
    <rect x="40" y="330" width="360" height="330" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="3"/>
    <line x1="40" y1="358" x2="400" y2="358" stroke="#1565c0" stroke-width="1.2"/>
    <line x1="40" y1="600" x2="400" y2="600" stroke="#1565c0" stroke-width="1.2"/>
    <text x="220" y="350" font-size="15" font-weight="bold" text-anchor="middle" fill="#0d47a1">Reserva</text>
    <g font-size="12" fill="#0d47a1">
      <text x="52" y="376">- id: int</text>
      <text x="52" y="394">- cliente_nome: str</text>
      <text x="52" y="412">- contato: str</text>
      <text x="52" y="430">- data: date</text>
      <text x="52" y="448">- horario: time</text>
      <text x="52" y="466">- quantidade_pessoas: int</text>
      <text x="52" y="484">- observacao: str [0..1]</text>
      <text x="52" y="502">- status: StatusReserva</text>
      <text x="52" y="520">- mesa_id: int  &#171;FK&#187;</text>
      <text x="52" y="538">- pedido_id: int [0..1]  &#171;FK&#187;</text>
      <text x="52" y="556">- criado_em: datetime</text>
      <text x="52" y="574">- atualizado_em: datetime</text>
      <text x="52" y="620">+ to_dict(): dict</text>
      <text x="52" y="642" font-size="11" fill="#1565c0">tabela: reservas</text>
    </g>
  </g>

  <!-- ====================== LISTA DE ESPERA (nova) ====================== -->
  <g>
    <rect x="880" y="330" width="360" height="330" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="3"/>
    <line x1="880" y1="358" x2="1240" y2="358" stroke="#1565c0" stroke-width="1.2"/>
    <line x1="880" y1="600" x2="1240" y2="600" stroke="#1565c0" stroke-width="1.2"/>
    <text x="1060" y="350" font-size="15" font-weight="bold" text-anchor="middle" fill="#0d47a1">ListaEspera</text>
    <g font-size="12" fill="#0d47a1">
      <text x="892" y="376">- id: int</text>
      <text x="892" y="394">- nome: str</text>
      <text x="892" y="412">- contato: str</text>
      <text x="892" y="430">- quantidade_pessoas: int</text>
      <text x="892" y="448">- entrada_em: datetime</text>
      <text x="892" y="466">- observacao: str [0..1]</text>
      <text x="892" y="484">- status: StatusListaEspera</text>
      <text x="892" y="502">- atendido_em: datetime [0..1]</text>
      <text x="892" y="520">- reserva_id: int [0..1]  &#171;FK&#187;</text>
      <text x="892" y="538">- mesa_id: int [0..1]  &#171;FK&#187;</text>
      <text x="892" y="556">- pedido_id: int [0..1]  &#171;FK&#187;</text>
      <text x="892" y="620">+ to_dict(posicao): dict</text>
      <text x="892" y="642" font-size="11" fill="#1565c0">tabela: lista_espera</text>
    </g>
  </g>

  <!-- ====================== PEDIDO (existente) ====================== -->
  <g>
    <rect x="490" y="800" width="300" height="162" fill="#eeeeee" stroke="#555" stroke-width="1.6" rx="3"/>
    <line x1="490" y1="828" x2="790" y2="828" stroke="#555" stroke-width="1.2"/>
    <line x1="490" y1="908" x2="790" y2="908" stroke="#555" stroke-width="1.2"/>
    <text x="640" y="820" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Pedido</text>
    <g font-size="12" fill="#333">
      <text x="502" y="846">- id: int</text>
      <text x="502" y="864">- mesa_id: int  &#171;FK&#187;</text>
      <text x="502" y="882">- status: str</text>
      <text x="502" y="900">- observacao: str [0..1]</text>
      <text x="502" y="926">+ calcular_total(): float</text>
      <text x="502" y="944">+ quantidade_itens(): int</text>
    </g>
  </g>

  <!-- ====================== SERVIÇO (nova) ====================== -->
  <g>
    <rect x="40" y="710" width="400" height="252" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="3"/>
    <line x1="40" y1="756" x2="440" y2="756" stroke="#2e7d32" stroke-width="1.2"/>
    <text x="240" y="730" font-size="11" text-anchor="middle" fill="#2e7d32" font-style="italic">&#171;service&#187;</text>
    <text x="240" y="748" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b5e20">ReservaServico</text>
    <g font-size="12" fill="#1b5e20">
      <text x="52" y="776">+ motivo_indisponibilidade(mesa, data,</text>
      <text x="64" y="792">horario, pessoas): ErroReserva [0..1]</text>
      <text x="52" y="812">+ reserva_conflitante(mesa_id, data,</text>
      <text x="64" y="828">horario): Reserva [0..1]</text>
      <text x="52" y="848">+ mesas_disponiveis(data, horario,</text>
      <text x="64" y="864">pessoas): Mesa [*]</text>
      <text x="52" y="884">+ mesas_livres_agora(pessoas): Mesa [*]</text>
      <text x="52" y="904">+ ocupar_mesa(mesa): Pedido</text>
      <text x="52" y="924">+ finalizar_reservas_encerradas(pedido_id): int</text>
      <text x="52" y="948" font-size="11" fill="#2e7d32">DURACAO_RESERVA = 2 horas</text>
    </g>
  </g>

  <!-- ====================== ERRO ====================== -->
  <g>
    <rect x="880" y="800" width="360" height="130" fill="#ffebee" stroke="#c62828" stroke-width="1.6" rx="3"/>
    <line x1="880" y1="846" x2="1240" y2="846" stroke="#c62828" stroke-width="1.2"/>
    <line x1="880" y1="906" x2="1240" y2="906" stroke="#c62828" stroke-width="1.2"/>
    <text x="1060" y="820" font-size="11" text-anchor="middle" fill="#c62828" font-style="italic">&#171;exception&#187;</text>
    <text x="1060" y="838" font-size="15" font-weight="bold" text-anchor="middle" fill="#b71c1c">ErroReserva</text>
    <g font-size="12" fill="#b71c1c">
      <text x="892" y="864">- mensagem: str</text>
      <text x="892" y="882">- status_http: int</text>
      <text x="892" y="900">- extras: dict</text>
      <text x="892" y="924">+ to_dict(): dict</text>
    </g>
  </g>

  <!-- ====================== RELAÇÕES ====================== -->

  <!-- Reserva -> Mesa (agregação) -->
  <line x1="340" y1="330" x2="520" y2="222" stroke="#555" stroke-width="1.4" marker-end="url(#agg)"/>
  <text x="352" y="316" font-size="11" fill="#555">0..*</text>
  <text x="500" y="244" font-size="11" fill="#555">1</text>
  <text x="462" y="318" font-size="11" text-anchor="end" fill="#555" font-style="italic">reserva em</text>

  <!-- ListaEspera -> Mesa -->
  <line x1="940" y1="330" x2="762" y2="222" stroke="#555" stroke-width="1.4" marker-end="url(#agg)"/>
  <text x="928" y="316" font-size="11" fill="#555">0..*</text>
  <text x="776" y="244" font-size="11" fill="#555">0..1</text>
  <text x="858" y="246" font-size="11" fill="#555" font-style="italic">mesa atribuída</text>

  <!-- Reserva -> Pedido -->
  <line x1="300" y1="660" x2="500" y2="800" stroke="#555" stroke-width="1.4" marker-end="url(#nav)"/>
  <text x="306" y="676" font-size="11" fill="#555">0..1</text>
  <text x="474" y="796" font-size="11" fill="#555">0..1</text>
  <text x="466" y="750" font-size="11" fill="#555" font-style="italic">atendimento aberto</text>
  <text x="466" y="764" font-size="11" fill="#555" font-style="italic">no check-in</text>

  <!-- ListaEspera -> Pedido -->
  <line x1="980" y1="660" x2="782" y2="800" stroke="#555" stroke-width="1.4" marker-end="url(#nav)"/>
  <text x="962" y="676" font-size="11" fill="#555">0..1</text>
  <text x="796" y="796" font-size="11" fill="#555">0..1</text>
  <text x="844" y="700" font-size="11" text-anchor="end" fill="#555" font-style="italic">atendimento aberto</text>

  <!-- ListaEspera -> Reserva -->
  <line x1="880" y1="490" x2="400" y2="490" stroke="#555" stroke-width="1.4" marker-end="url(#nav)"/>
  <text x="858" y="482" font-size="11" fill="#555">0..1</text>
  <text x="412" y="482" font-size="11" fill="#555">0..1</text>
  <text x="640" y="482" font-size="11" text-anchor="middle" fill="#555" font-style="italic">cliente com reserva que entrou na fila</text>

  <!-- Pedido -> Mesa -->
  <polyline points="790,868 850,868 850,180 786,180" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#agg)"/>
  <text x="800" y="888" font-size="11" fill="#555">0..*</text>
  <text x="800" y="172" font-size="11" fill="#555">1</text>

  <!-- Enum -> Reserva -->
  <line x1="165" y1="252" x2="165" y2="330" stroke="#6a1b9a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#dep)"/>
  <!-- Enum -> ListaEspera -->
  <line x1="1115" y1="192" x2="1115" y2="330" stroke="#6a1b9a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#dep)"/>

  <!-- Servico -> Reserva / Mesa / Pedido / Erro -->
  <line x1="240" y1="710" x2="240" y2="662" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#nav)"/>
  <text x="248" y="692" font-size="10" fill="#2e7d32" font-style="italic">&#171;use&#187;</text>
  <polyline points="300,966 300,1006 1060,1006 1060,936" fill="none" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#nav)"/>
  <text x="660" y="1000" font-size="10" fill="#2e7d32" font-style="italic">&#171;throws&#187;</text>
  <line x1="440" y1="880" x2="490" y2="880" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#nav)"/>
  <text x="444" y="874" font-size="10" fill="#2e7d32" font-style="italic">&#171;cria&#187;</text>

  <!-- nota -->
  <rect x="470" y="300" width="330" height="128" fill="#fffde7" stroke="#f9a825" stroke-width="1.2"/>
  <path d="M470,300 L470,284 L500,300 Z" fill="#fffde7" stroke="#f9a825" stroke-width="1.2"/>
  <g font-size="11" fill="#795548">
    <text x="482" y="320" font-weight="bold">Regras garantidas por ReservaServico:</text>
    <text x="482" y="338">• mesa.capacidade &#8805; quantidade_pessoas</text>
    <text x="482" y="356">• sem outra reserva na mesma mesa com</text>
    <text x="494" y="372">menos de 2h de diferença</text>
    <text x="482" y="390">• mesa sem pedido em aberto no horário</text>
    <text x="482" y="408">• disponibilidade recalculada sempre que</text>
    <text x="494" y="422">um pedido é aberto ou encerrado</text>
  </g>
</svg>
